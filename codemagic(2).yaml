workflows:
  autodiag-pro-android-debug:
    name: AutoDiag Pro Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Extract AutoDiag Pro project ZIP
        script: |
          unzip -q AutoDiagPro-Android-Project.zip -d extracted
      - name: Generate Gradle wrapper
        script: |
          cd extracted
          gradle wrapper --gradle-version 8.9
      - name: Build debug APK
        script: |
          cd extracted
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug
    artifacts:
      - extracted/app/build/outputs/apk/debug/app-debug.apk
